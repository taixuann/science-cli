projects_root: /Users/tai/workspace/projects/active_projects
theme: publication-nature
default_dpi: 300
default_figure_format: pdf
file_naming:
  patterns:
  - id: rNcN
    template: '{date_code}_{material}{batch?}_{matrix}_{technique}_{type?}_{suffix?}'
    description: Standard rNcN convention (rectangular crossbar)
    regex: ^(?P<date_code>\d{6})_(?P<material>[^_]+?)(?:_(?P<batch>\d+))?_(?P<matrix>r\d+c\d+)_(?P<technique>[^_]+)(?:_(?P<type>[^_]+))?(?:_(?P<suffix>\d+))?\.\w+$
  - id: bN-tN
    template: '{date_code}_{material}{batch?}_b{bot}-t{top}_{technique}_{type?}_{suffix?}'
    description: Bottom/top crossbar convention
    regex: ^(?P<date_code>\d{6})_(?P<material>[^_]+?)(?:_(?P<batch>\d+))?_b(?P<bot>\d+)-t(?P<top>\d+)_(?P<technique>[^_]+)(?:_(?P<type>[^_]+))?(?:_(?P<suffix>\d+))?\.\w+$
  - id: rN-cN-iv
    template: '{date_code}_{material}_iv-sweep_{matrix}_{suffix}.{ext}'
    description: 'rN-cN convention (1-indexed, hyphen) for iv-sweep data: 120526_cu-c-pda-ito(c)_iv-sweep_r1-c2_001.csv'
    regex: ^(?P<date_code>\d{6})_(?P<material>[-A-Za-z0-9/()]+)_(?P<technique>[A-Za-z0-9/-]+)_(?P<matrix>r\d+-c\d+)_(?P<suffix>\d+)\.(?P<ext>\w+)$
  - id: cv-deposition
    template: '{date_code}_{material}_cv-deposition{suffix?}.{ext}'
    description: 'CV deposition (Autolab): 110526_material_cv-deposition[_suffix].txt'
    regex: ^(?P<date_code>\d{6})_(?P<material>.+?)_(?P<technique>cv-deposition)(?:_(?P<suffix>[^_]+))?\.\w+$
  - id: ca-doping
    template: '{date_code}_{material}_ca-doping{suffix?}.{ext}'
    description: 'CA doping (Autolab): 110526_material_ca-doping[_suffix].txt'
    regex: ^(?P<date_code>\d{6})_(?P<material>.+?)_(?P<technique>ca-doping)(?:_(?P<suffix>[^_]+))?\.\w+$
  - id: raman-spectrum
    template: '{date_code}_{material}_raman[-sers]_{suffix}.{ext}'
    description: 'Raman/SERS spectrum (Horiba USTH): 260526_PDA(q)-ITO_raman-sers_01.txt'
    regex: ^(?P<date_code>\d{6})_(?P<material>.+?)_(?P<technique>raman(?:-sers)?)(?:_(?P<suffix>\d+))?\.\w+$
  - id: uv-vis
    template: '{date_code}_{material}_uv-vis.{ext}'
    description: 'UV-Vis transmittance (IOP Hanoi): 280526_PDA(q)-ITO_uv-vis.txt'
    regex: ^(?P<date_code>\d{6})_(?P<material>.+?)_(?P<technique>uv-vis)\.\w+$
devices:
  autolab-usth:
    label: Autolab USTH (CV deposition)
    delimiter: ;
    decimal: .
    header_lines: 0
    encoding: utf-8
    columns:
      current: WE(1).Current (A)
      potential: WE(1).Potential (V)
      scan: Scan
      time: Time (s)
      index: Index
      corrected_time: Corrected time (s)
      frequency: Frequency (Hz)
      z_real: "Z' (\u03A9)"
      z_imag: "-Z'' (\u03A9)"
      magnitude: "Z (\u03A9)"
      phase: "-Phase (\xB0)"
  keithley-clarius:
    label: Keithley Clarius (IV sweep)
    delimiter: ','
    decimal: .
    header_lines: 1
    encoding: utf-8-sig
    columns:
      voltage: BV
      current: BI
      time: Time
  keithley-2400:
    label: Keithley 2400 SourceMeter
    delimiter: "\t"
    decimal: .
    header_lines: 21
    encoding: utf-8
    columns:
      voltage: Untitled
      current: Untitled 1
      time: Untitled 2
  horiba-usth:
    label: Horiba LabRAM HR Evolution (USTH)
    delimiter: "\t"
    decimal: ','
    header_lines: 45
    encoding: latin1
    names:
    - shift
    - intensity
techniques:
  ec-cv:
    label: CV Deposition
    grammar_codes:
    - cv
    - CV
    - cv-deposition
    default_device: autolab-usth
    devices:
      autolab-usth:
        delimiter: ;
        decimal: .
        header_lines: 0
        encoding: utf-8
        columns:
          current: WE(1).Current (A)
          potential: WE(1).Potential (V)
          scan: Scan
          time: Time (s)
          index: Index
          corrected_time: Corrected time (s)
          frequency: Frequency (Hz)
          z_real: "Z' (\u03A9)"
          z_imag: "-Z'' (\u03A9)"
          magnitude: "Z (\u03A9)"
          phase: "-Phase (\xB0)"
  ec-ca:
    label: CA Doping
    grammar_codes:
    - ca
    - CA
    - ca-doping
    default_device: autolab-usth
    devices:
      autolab-usth:
        delimiter: ;
        decimal: .
        header_lines: 0
        encoding: utf-8
        columns:
          current: WE(1).Current (A)
          potential: WE(1).Potential (V)
          scan: Scan
          time: Time (s)
          index: Index
          corrected_time: Corrected time (s)
          frequency: Frequency (Hz)
          z_real: "Z' (\u03A9)"
          z_imag: "-Z'' (\u03A9)"
          magnitude: "Z (\u03A9)"
          phase: "-Phase (\xB0)"
  ec-eis:
    label: EIS
    patterns:
    - _EIS_
    grammar_codes:
    - eis
    - EIS
    - impedance
    default_device: autolab-usth
    devices:
      autolab-usth:
        delimiter: ;
        decimal: .
        header_lines: 0
        encoding: utf-8
        columns:
          current: WE(1).Current (A)
          potential: WE(1).Potential (V)
          scan: Scan
          time: Time (s)
          index: Index
          corrected_time: Corrected time (s)
          frequency: Frequency (Hz)
          z_real: "Z' (\u03A9)"
          z_imag: "-Z'' (\u03A9)"
          magnitude: "Z (\u03A9)"
          phase: "-Phase (\xB0)"
  iv-sweep:
    label: IV Sweep
    grammar_codes:
    - iv
    - IV
    - iv-sweep
    - iv_dc
    default_device: keithley-2400
    types:
      forming:
        label: Forming
        step_type: forming
      set:
        label: Set
        step_type: set
      reset:
        label: Reset
        step_type: reset
  raman:
    label: Raman Spectroscopy
    grammar_codes:
    - raman
    - sers
    - raman-sers
    - SERS
    default_device: horiba-usth
  uv-vis:
    label: UV-Vis Transmittance
    grammar_codes:
    - uv-vis
    - uvvis
    - uv_vis
    default_device: spectrometer-iop
defaults:
  iv-sweep: keithley-2400
  ec-cv: autolab-usth
  ec-ca: autolab-usth
  ec-eis: autolab-usth
  raman: horiba-usth
  uv-vis: spectrometer-iop
plot:
  labels:
    iv-sweep:
      xlabel: Voltage (V)
      ylabel: Current (A)
    iv-breakdown:
      xlabel: Voltage (V)
      ylabel: Current (A)
    iv-leakage:
      xlabel: Voltage (V)
      ylabel: "Current density (A/cm\xB2)"
    ec-cv:
      xlabel: Potential (V)
      ylabel: Current (A)
    ec-ca:
      xlabel: Time (s)
      ylabel: I (A)
    ec-eis:
      xlabel: "Z' (\u03A9)"
      ylabel: "-Z'' (\u03A9)"
    raman:
      xlabel: "Raman shift (cm\u207B\xB9)"
      ylabel: Intensity (counts)
    uv-vis:
      xlabel: Wavelength (nm)
      ylabel: Transmission (%)
