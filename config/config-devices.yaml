studies:
  iv:
    iv-bipolar-sweep:
      label: "Bipolar IV Sweep 0\u2192+V\u2192-V\u21920"
      patterns:
      - iv-sweep
      - _IV
      - iv-bipolar
      - sweep_
      legacy_codes:
      - iv
      - iv-sweep
      - iv_dc
      instruments:
        keithley-2400:
          delimiter: "\t"
          header_lines: 23
          columns:
            voltage: Untitled
            current: Untitled 1
            time: Untitled 2
          metadata:
            compliance:
              method: parse
              parser: compliance
              description: Compliance current (A)
            sweep_range:
              method: parse
              parser: sweep_range
              description: Sweep voltage range start/stop (V)
        keysight-b1500a:
          delimiter: ','
          header_lines: 245
          columns:
            voltage: V1
            current: I2
          metadata:
            set_voltage:
              method: parse
              parser: set_voltage
              description: Sweep max voltage from SetupTitle (V)
            compliance:
              method: parse
              parser: compliance
              description: Compliance current from Primary.Compliance (A)
            sweep_range:
              method: parse
              parser: sweep_range
              description: Sweep voltage range start/stop (V)
            repeat_count:
              method: parse
              parser: repeat_count
              description: Measurement repeat count
            compliance_analysis:
              method: analyze
              function: analyze_iv_compliance
              inputs:
              - voltage
              - current
              outputs:
              - in_compliance
              - compliance_current
              - compliance_voltage
              description: Compliance detection from IV data
    iv-breakdown:
      label: "Breakdown \u2014 ramped voltage to breakdown"
      patterns:
      - breakdown
      - _bd
      - _Vbd
      - bd_
      legacy_codes:
      - bd
      - breakdown
      instruments: {}
    iv-leakage:
      label: "Leakage \u2014 low-bias leakage current"
      patterns:
      - leakage
      - _leak
      - leak_
      legacy_codes:
      - leak
      - leakage
      instruments: {}
  pulse:
    pulse-stp-decay:
      label: "STP Decay \u2014 set pulse + current decay read"
      patterns:
      - stp
      - _STP
      - stp_decay
      - short-term
      legacy_codes:
      - stp
      - pulse-stp
      - short-term-plasticity
      instruments:
        keysight-b1500a:
          delimiter: ','
          header_lines: 147
          columns:
            time: Time
            voltage: MeasResult1_value
            current: MeasResult2_value
          metadata:
            compliance:
              method: parse
              parser: compliance
              description: Compliance current from Primary.Compliance (A)
            repeat_count:
              method: parse
              parser: repeat_count
              description: Measurement repeat count
            waveform_params:
              method: analyze
              function: analyze_waveform_params
              inputs:
              - waveform_time
              - waveform_voltage
              outputs:
              - rise_us
              - fall_us
              - set_width_us
              - read_width_us
              description: Extracted pulse parameters from waveform definition
    pulse-ppf:
      label: "Paired-Pulse Facilitation \u2014 double set with \u0394t"
      patterns:
      - ppf
      - _PPF
      - paired-pulse
      legacy_codes:
      - ppf
      - pulse-ppf
      - paired-pulse
      instruments:
        keysight-b1500a:
          delimiter: ','
          header_lines: 147
          columns:
            time: Time
            voltage: MeasResult1_value
            current: MeasResult2_value
    pulse-endurance:
      label: Pulse Endurance Cycling
      patterns:
      - endurance
      - _endurance
      - endurance_
      legacy_codes:
      - endurance
      - pulse-endurance
      instruments:
        keysight-b1500a:
          delimiter: ','
          header_lines: 147
          columns:
            time: Time
            voltage: MeasResult1_value
            current: MeasResult2_value
    pulse-retention:
      label: Pulse Retention Time
      patterns:
      - retention
      - _retention
      - retention_
      legacy_codes:
      - retention
      - pulse-retention
      instruments: {}
  raman:
    raman-spectrum:
      label: Raman Spectroscopy
      patterns:
      - _raman
      - _sers
      - raman-sers
      - _SERS
      legacy_codes:
      - raman
      - sers
      - raman-sers
      instruments:
        horiba-usth:
          delimiter: "\t"
          decimal: ','
          header_lines: 45
          encoding: latin1
          names:
          - shift
          - intensity
  uv-vis:
    uv-vis-spectrum:
      label: UV-Vis Transmittance
      patterns:
      - _uv-vis
      - _uvvis
      - uv-vis
      - uvvis
      legacy_codes:
      - uv-vis
      - uvvis
      - uv_vis
      instruments:
        spectrometer-iop:
          delimiter: ','
          header_lines: 1
          encoding: latin1
          columns:
            wavelength: Wavelength nm.
            transmittance: T%
  ec:
    ec-cv:
      label: Cyclic Voltammetry
      patterns:
      - _CV.
      - .cv
      - cv_
      - cv-
      legacy_codes: []
      instruments:
        autolab-usth:
          delimiter: ";"
          decimal: .
          header_lines: 0
          encoding: utf-8
          columns:
            current: WE(1).Current (A)
            potential: WE(1).Potential (V)
            scan: Scan
            time: Time (s)
            index: Index
            corrected_time: Corrected time (s)
            frequency: Frequency (Hz)
            z_real: "Z' (\u03A9)"
            z_imag: "-Z'' (\u03A9)"
            magnitude: "Z (\u03A9)"
            phase: "-Phase (\xB0)"
    ec-ca:
      label: Chronoamperometry
      patterns:
      - _CA.
      - .ca
      - ca_
      - ca-
      legacy_codes: []
      instruments:
        autolab-usth:
          delimiter: ";"
          decimal: .
          header_lines: 0
          encoding: utf-8
          columns:
            current: WE(1).Current (A)
            potential: WE(1).Potential (V)
            scan: Scan
            time: Time (s)
            index: Index
            corrected_time: Corrected time (s)
            frequency: Frequency (Hz)
            z_real: "Z' (\u03A9)"
            z_imag: "-Z'' (\u03A9)"
            magnitude: "Z (\u03A9)"
            phase: "-Phase (\xB0)"
    ec-eis:
      label: Electrochemical Impedance Spectroscopy
      patterns:
      - .mpt
      - _EIS.
      - .eis
      - _impedance
      - .z
      legacy_codes: []
      instruments:
        autolab-usth:
          delimiter: ";"
          decimal: .
          header_lines: 0
          encoding: utf-8
          columns:
            current: WE(1).Current (A)
            potential: WE(1).Potential (V)
            scan: Scan
            time: Time (s)
            index: Index
            corrected_time: Corrected time (s)
            frequency: Frequency (Hz)
            z_real: "Z' (\u03A9)"
            z_imag: "-Z'' (\u03A9)"
            magnitude: "Z (\u03A9)"
            phase: "-Phase (\xB0)"
  afm:
    afm-topography:
      label: AFM/SPM Surface Topography
      patterns:
      - .gwy
      - .spm
      - .ibw
      - .jpk
      - .stp
      - .top
      legacy_codes: []
      instruments: {}
device_types:
  volatile-memristor:
    label: Volatile Memristor
    description: One-directional switching with volatile decay
    studies:
    - iv:iv-bipolar-sweep
    - pulse:pulse-endurance
    - pulse:pulse-stp-decay
    - pulse:pulse-ppf
    analysis_mode: volatile
    library: iv
  non-volatile-memristor:
    label: Non-Volatile Memristor
    description: Bidirectional switching with retention
    studies:
    - iv:iv-bipolar-sweep
    - pulse:pulse-endurance
    - pulse:pulse-retention
    analysis_mode: bipolar
    library: iv
legacy_to_study:
  iv-sweep: iv:iv-bipolar-sweep
  iv-breakdown: iv:iv-breakdown
  iv-leakage: iv:iv-leakage
  pulse-stp: pulse:pulse-stp-decay
  pulse-ppf: pulse:pulse-ppf
  pulse-endurance: pulse:pulse-endurance
  pulse-retention: pulse:pulse-retention
  raman: raman:raman-spectrum
  uv-vis: uv-vis:uv-vis-spectrum
  ec-cv: ec:ec-cv
  ec-ca: ec:ec-ca
  ec-eis: ec:ec-eis
  afm-gwy: afm:afm-topography
  afm-spm: afm:afm-topography
  afm-ibw: afm:afm-topography
  afm-jpk: afm:afm-topography
  afm-stp: afm:afm-topography
  afm-top: afm:afm-topography
