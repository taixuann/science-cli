# config-devices.yaml — Device types and legacy mapping
#
# Studies have been moved to config-studies.yaml (Phase 2).
# This file retains device_types, legacy_to_study, and techniques (Phase 4).

device_types:
  volatile-memristor:
    label: Volatile Memristor
    description: One-directional switching with volatile decay
    studies:
    - iv:iv-bipolar-sweep
    - pulse:pulse-endurance
    - pulse:pulse-stp-decay
    - pulse:pulse-ppf
    analysis_mode: volatile
    library: iv
  non-volatile-memristor:
    label: Non-Volatile Memristor
    description: Bidirectional switching with retention
    studies:
    - iv:iv-bipolar-sweep
    - pulse:pulse-endurance
    - pulse:pulse-retention
    analysis_mode: bipolar
    library: iv
legacy_to_study:
  iv-sweep: iv:iv-bipolar-sweep
  iv-breakdown: iv:iv-breakdown
  iv-leakage: iv:iv-leakage
  pulse-stp: pulse:pulse-stp-decay
  pulse-ppf: pulse:pulse-ppf
  pulse-endurance: pulse:pulse-endurance
  pulse-retention: pulse:pulse-retention
  raman: raman:raman-spectrum
  uv-vis: uv-vis:uv-vis-spectrum
  ec-cv: ec:ec-cv
  ec-ca: ec:ec-ca
  ec-eis: ec:ec-eis
  afm-gwy: afm:afm-topography
  afm-spm: afm:afm-topography
  afm-ibw: afm:afm-topography
  afm-jpk: afm:afm-topography
  afm-stp: afm:afm-topography
  afm-top: afm:afm-topography
techniques:
  ec-cv:
    label: CV Deposition
    grammar_codes:
    - cv
    - CV
    - cv-deposition
    default_device: autolab-usth
    devices:
      autolab-usth:
        delimiter: ";"
        decimal: .
        header_lines: 0
        encoding: utf-8
        columns:
          current: WE(1).Current (A)
          potential: WE(1).Potential (V)
          scan: Scan
          time: Time (s)
          index: Index
          corrected_time: Corrected time (s)
          frequency: Frequency (Hz)
          z_real: "Z' (\u03A9)"
          z_imag: "-Z'' (\u03A9)"
          magnitude: "Z (\u03A9)"
          phase: "-Phase (\xB0)"
  ec-ca:
    label: CA Doping
    grammar_codes:
    - ca
    - CA
    - ca-doping
    default_device: autolab-usth
    devices:
      autolab-usth:
        delimiter: ";"
        decimal: .
        header_lines: 0
        encoding: utf-8
        columns:
          current: WE(1).Current (A)
          potential: WE(1).Potential (V)
          scan: Scan
          time: Time (s)
          index: Index
          corrected_time: Corrected time (s)
          frequency: Frequency (Hz)
          z_real: "Z' (\u03A9)"
          z_imag: "-Z'' (\u03A9)"
          magnitude: "Z (\u03A9)"
          phase: "-Phase (\xB0)"
  ec-eis:
    label: EIS
    patterns:
    - _EIS_
    grammar_codes:
    - eis
    - EIS
    - impedance
    default_device: autolab-usth
    devices:
      autolab-usth:
        delimiter: ";"
        decimal: .
        header_lines: 0
        encoding: utf-8
        columns:
          current: WE(1).Current (A)
          potential: WE(1).Potential (V)
          scan: Scan
          time: Time (s)
          index: Index
          corrected_time: Corrected time (s)
          frequency: Frequency (Hz)
          z_real: "Z' (\u03A9)"
          z_imag: "-Z'' (\u03A9)"
          magnitude: "Z (\u03A9)"
          phase: "-Phase (\xB0)"
  iv-sweep:
    label: IV Sweep
    grammar_codes:
    - iv
    - IV
    - iv-sweep
    - iv_dc
    default_device: keithley-2400
    types:
      forming:
        label: Forming
        step_type: forming
      set:
        label: Set
        step_type: set
      reset:
        label: Reset
        step_type: reset
  raman:
    label: Raman Spectroscopy
    grammar_codes:
    - raman
    - sers
    - raman-sers
    - SERS
    default_device: horiba-usth
  uv-vis:
    label: UV-Vis Transmittance
    grammar_codes:
    - uv-vis
    - uvvis
    - uv_vis
    default_device: spectrometer-iop
