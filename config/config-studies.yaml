# config-studies.yaml — Canonical study definitions (v6)
#
# This is the single source of truth for all study configurations.
# Studies define detection patterns, instrument bindings, data shapes,
# and device-specific metadata requirements.
#
# Moved from config-devices.yaml in Phase 2 of the modular config split.

studies:
  iv:
    iv-bipolar-sweep:
      label: "Bipolar IV Sweep 0\u2192+V\u2192-V\u21920"
      patterns:
        - iv-sweep
        - _IV
        - iv-bipolar
        - sweep_
      legacy_codes:
        - iv
        - iv-sweep
        - iv_dc
      data_shape:
        kind: trace_2d
        columns:
          - time_s
          - voltage_v
          - current_a
      instruments:
        keithley-2400:
          header_lines: 23
          metadata:
            compliance:
              method: parse
              parser: compliance
              description: Compliance current (A)
            sweep_range:
              method: parse
              parser: sweep_range
              description: Sweep voltage range start/stop (V)
        keysight-b1500a:
          header_lines: 245
          columns:
            voltage: V1
            current: I2
          column_mapping:
            x: voltage
            y: current
          current_sign: -1 # Keysight outputs negative current for bipolar switching
          metadata:
            set_voltage:
              method: parse
              parser: set_voltage
              description: Sweep max voltage from SetupTitle (V)
            compliance:
              method: parse
              parser: compliance
              description: Compliance current from Primary.Compliance (A)
            sweep_range:
              method: parse
              parser: sweep_range
              description: Sweep voltage range start/stop (V)
            repeat_count:
              method: parse
              parser: repeat_count
              description: Measurement repeat count
            compliance_analysis:
              method: analyze
              function: analyze_iv_compliance
              inputs:
                - voltage
                - current
              outputs:
                - in_compliance
                - compliance_current
                - compliance_voltage
              description: Compliance detection from IV data
      plot:
        layout: single
        columns:
          x: voltage
          y: current
        axis:
          xlabel: "Voltage (V)"
          ylabel: "Current (A)"
        current_sign: -1 # Keysight outputs negative current for bipolar switching
    iv-breakdown:
      label: "Breakdown \u2014 ramped voltage to breakdown"
      patterns:
        - breakdown
        - _bd
        - _Vbd
        - bd_
      legacy_codes:
        - bd
        - breakdown
      data_shape:
        kind: trace_2d
        columns:
          - time_s
          - voltage_v
          - current_a
      instruments: {}
      plot:
        layout: single
        columns:
          x: voltage
          y: current
        axis:
          xlabel: "Voltage (V)"
          ylabel: "Current (A)"
        current_sign: -1 # Keysight outputs negative current for bipolar switching
    iv-leakage:
      label: "Leakage \u2014 low-bias leakage current"
      patterns:
        - leakage
        - _leak
        - leak_
      legacy_codes:
        - leak
        - leakage
      data_shape:
        kind: trace_2d
        columns:
          - time_s
          - voltage_v
          - current_a
      instruments: {}
      plot:
        layout: single
        columns:
          x: voltage
          y: current
        axis:
          xlabel: "Voltage (V)"
          ylabel: "Current (A)"
        current_sign: -1 # Keysight outputs negative current for bipolar switching
        figure: {}
        axes:
          yscale: log

  pulse:
    pulse-stp-decay:
      label: "STP Decay \u2014 set pulse + current decay read"
      patterns:
        - stp
        - _STP
        - stp_decay
        - short-term
      legacy_codes:
        - stp
        - pulse-stp
        - short-term-plasticity
      data_shape:
        kind: waveform_2d
        columns:
          - time_s
          - voltage_v
        units:
          - s
          - V
      derived_metadata:
        - v_set_v
        - v_read_v
        - set_width_us
        - read_width_us
        - rise_us
        - fall_us
        - repeat_pattern
      device_overrides:
        volatile-memristor:
          add:
            - decay_tau_ms
            - r_read_ohm
      instruments:
        keysight-b1500a:
          header_lines: 147
          columns:
            time: Time
            voltage: MeasResult1_value
            current: MeasResult2_value
          column_mapping:
            x: time
            y: current
          current_sign: -1 # Keysight outputs negative current for bipolar switching
          metadata:
            compliance:
              method: parse
              parser: compliance
              description: Compliance current from Primary.Compliance (A)
            repeat_count:
              method: parse
              parser: repeat_count
              description: Measurement repeat count
            waveform_params:
              method: analyze
              function: analyze_waveform_params
              inputs:
                - waveform_time
                - waveform_voltage
              outputs:
                - rise_us
                - fall_us
                - set_width_us
                - read_width_us
              description: Extracted pulse parameters from waveform definition
      plot:
        layout: dual_axis
        columns:
          x: time
          y: current
          y2: voltage
        axis:
          xlabel: "Time (µs)"
          ylabel: "Current (A)"
          ylabel2: "Voltage (V)"
          ycolor: "#CC0000" # match current series color
          y2color: "#0055CC" # match voltage series color
        filter:
          field: voltage
          min: 0.05
        current_sign: -1 # Keysight outputs negative current for bipolar switching
        series:
          current:
            color: "#CC0000"
            linewidth: 1.0
            label: "I(t)"
          voltage:
            color: "#0055CC"
            linewidth: 1.0
            label: "V(t)"
      interactive:
        analyze:
          menu_title: "Select analysis for STP decay:"
          options:
            - name: "Extract decay — fit segments, plot overview"
              handler: "science_cli.library.pulse.pulse_stp_decay.analyze_all"
              description: "Segment-aware: detect segments, fit each, overview plot, metadata"
            - name: "Overlay decay curves"
              handler: "science_cli.library.pulse.pulse_stp_decay.analyze_overlay"
              description: "Compare: plot fit curves of extracted-decay files"
              overlay: true

    pulse-ppf:
      label: "Paired-Pulse Facilitation"
      patterns:
        - ppf
        - _PPF
        - paired-pulse
      legacy_codes:
        - ppf
        - pulse-ppf
        - paired-pulse
      data_shape:
        kind: waveform_2d
        columns:
          - time_s
          - voltage_v
        units:
          - s
          - V
      derived_metadata:
        - v_set_v
        - v_read_v
        - set_width_us
        - read_width_us
        - rise_us
        - fall_us
        - repeat_pattern
      instruments:
        keysight-b1500a:
          header_lines: 147
          columns:
            time: Time
            voltage: MeasResult1_value
            current: MeasResult2_value
          column_mapping:
            x: time
            y: current
          current_sign: -1 # Keysight outputs negative current for bipolar switching
      plot:
        layout: single
        columns:
          x: time
          y: current
        axis:
          xlabel: "Time (µs)"
          ylabel: "Current (A)"
        current_sign: -1 # Keysight outputs negative current for bipolar switching

    pulse-endurance:
      label: Pulse Endurance Cycling
      patterns:
        - endurance
        - _endurance
        - endurance_
      legacy_codes:
        - endurance
        - pulse-endurance
      data_shape:
        kind: waveform_2d
        columns:
          - time_s
          - voltage_v
        units:
          - s
          - V
      derived_metadata:
        - v_set_v
        - v_read_v
        - set_width_us
        - read_width_us
        - rise_us
        - fall_us
        - repeat_pattern
      required_fields:
        - cycle
        - r_hrs_ohm
        - r_lrs_ohm
        - i_hrs_A
        - i_lrs_A
      device_overrides:
        volatile-memristor:
          add:
            - r_decay_ohm
          plot:
            series:
              hrs:
                color: "#2176AE"
                label: "R_decay"
        non-volatile-memristor:
          add:
            - r_high_ohm
            - r_low_ohm
      instruments:
        keysight-b1500a:
          header_lines: 147
          columns:
            time: Time
            voltage: MeasResult1_value
            current: MeasResult2_value
          column_mapping:
            x: time
            y: current
          current_sign: -1 # Keysight outputs negative current for bipolar switching
      plot:
        common:
          layout: multi_series
          axes:
            grid: false
          legend: false
          # No subsample — plot all data points
        log:
          columns:
            x: cycle
            y_series:
              hrs: r_hrs_ohm
              lrs: r_lrs_ohm
          axes:
            xscale: log
            yscale: log
            ylim_padding:
              below: 1.0
              above: 1.0
            yticks_show:
              min: 100
              max: 10000000
          series:
            hrs:
              color: "#CC0000"
              marker: "o"
              markersize: 10
              alpha: 0.7
              annotation:
                text: "HRS"
                ha: "right"
                va: "bottom"
                xytext: [-5, 12]
                fontweight: bold
                color: "#CC0000"
            lrs:
              color: "#0055CC"
              marker: "o"
              markersize: 10
              alpha: 0.7
              annotation:
                text: "LRS"
                ha: "right"
                va: "bottom"
                xytext: [-5, 12]
                fontweight: bold
                color: "#0055CC"
          current:
            columns:
              x: cycle
              y_series:
                lrs: i_lrs_A
                hrs: i_hrs_A
            axes:
              ylim_padding:
                below: 1.0
                above: 1.0
              yticks_show:
                min: 1e-8
                max: 1
        linear:
          columns:
            x: cycle
            y_series:
              hrs: r_hrs_ohm
              lrs: r_lrs_ohm
          axes:
            xscale: linear
            yscale: linear
            grid: true
          series:
            hrs:
              color: "#CC0000"
              marker: "o"
              markersize: 4
              alpha: 1
              type: scatter
            lrs:
              color: "#0055CC"
              marker: "s"
              markersize: 4
              alpha: 1
              type: scatter
          current:
            columns:
              x: cycle
              y_series:
                lrs: i_lrs_A
                hrs: i_hrs_A
            axes:
              ylim_padding:
                below: 0.5
                above: 0.5

      interactive:
        plot:
          menu_title: "Select plot type for pulse-endurance:"
          options:
            - name: "Resistance vs Cycles"
              handler: "science_cli.plot.generic.plot_endurance_resistance"
              description: "R_HRS, R_LRS, ratio over cycle number"
              scale: log
            - name: "Current vs Cycles"
              handler: "science_cli.plot.generic.plot_endurance_current"
              description: "I_LRS (V_set), I_HRS (V_read) over cycle number"
              scale: log
            - name: "Both"
              handler: "science_cli.plot.generic.plot_endurance_both"
              description: "Both resistance and current as separate files"
              scale: log
            - name: "Both (linear)"
              handler: "science_cli.plot.generic.plot_endurance_both"
              description: "Linear scale - both resistance and current"
              scale: linear
        analyze:
          ratio_histogram:
            menu_title: "Ratio Histogram"
            handler: "science_cli.library.pulse.pulse_endurance.ratio_histogram"
            description: "Distribution of R_HRS / R_LRS ratio values"
            plot:
              bins: 50
              xscale: "log"
              y_max_method: "percentile_99*1.2"
              series:
                bar:
                  color: "#2EA043"
                  alpha: 0.7
                  edgecolor: "black"
                  linewidth: 0.5
                fit:
                  type: "log-normal"
                  color: "black"
                  style: "--"
                  linewidth: 1.2
              legend:
                loc: "upper right"
                fontsize: 8

          current_ratio_histogram:
            menu_title: "Current Ratio Histogram"
            handler: "science_cli.library.pulse.pulse_endurance.current_ratio_histogram"
            description: "Distribution of I_LRS / I_HRS ratio values"
            plot:
              bins: 50
              xscale: "log"
              y_max_method: "percentile_99*1.2"
              series:
                bar:
                  color: "#2EA043"
                  alpha: 0.7
                  edgecolor: "black"
                  linewidth: 0.5
                fit:
                  type: "log-normal"
                  color: "black"
                  style: "--"
                  linewidth: 1.2
              legend:
                loc: "upper right"
                fontsize: 8

          ratio_vs_cycles:
            menu_title: "Ratio vs Cycles"
            handler: "science_cli.library.pulse.pulse_endurance.ratio_vs_cycles"
            description: "R_HRS/R_LRS ratio trend over cycle number"
            plot:
              axes:
                xscale: log
                yscale: log
              series:
                scatter:
                  color: "#CC7700"
                  size: 6
                  alpha: 0.6
                  label: "Data"
                fit:
                  color: "red"
                  style: "--"
                  linewidth: 1.2
              legend:
                loc: "upper right"
                fontsize: 8

          i_ratio_vs_cycles:
            menu_title: "Current Ratio vs Cycles"
            handler: "science_cli.library.pulse.pulse_endurance.i_ratio_vs_cycles"
            description: "I_LRS/I_HRS ratio trend over cycle number"
            plot:
              axes:
                xscale: log
                yscale: log
              series:
                scatter:
                  color: "#2176AE"
                  size: 6
                  alpha: 0.6
                  label: "Data"
                fit:
                  color: "red"
                  style: "--"
                  linewidth: 1.2
              legend:
                loc: "upper right"
                fontsize: 8

    pulse-retention:
      label: Pulse Retention Time
      patterns:
        - retention
        - _retention
        - retention_
      legacy_codes:
        - retention
        - pulse-retention
      data_shape:
        kind: waveform_2d
        columns:
          - time_s
          - voltage_v
        units:
          - s
          - V
      derived_metadata:
        - v_set_v
        - v_read_v
        - set_width_us
        - read_width_us
        - rise_us
        - fall_us
        - repeat_pattern
      device_overrides:
        non-volatile-memristor:
          add:
            - r_read_ohm
      instruments:
        keysight-b1500a:
          header_lines: 147
          columns:
            time: Time
            voltage: MeasResult1_value
            current: MeasResult2_value
      plot:
        layout: single
        columns:
          x: time
          y: current
        axis:
          xlabel: "Time (s)"
          ylabel: "Current (A)"
        current_sign: -1 # Keysight outputs negative current for bipolar switching
        figure: {}
        axes:
          xscale: log

  raman:
    raman-spectrum:
      label: Raman Spectroscopy
      patterns:
        - _raman
        - _sers
        - raman-sers
        - _SERS
      legacy_codes:
        - raman
        - sers
        - raman-sers
      data_shape:
        kind: spectrum_2d
        columns:
          - wavelength_nm
          - intensity
        units:
          - nm
          - counts
      instruments:
        horiba-usth:
          header_lines: 45
      plot:
        layout: single
        columns:
          x: wavelength_nm
          y: intensity
        axis:
          xlabel: "Wavelength (nm)"
          ylabel: "Intensity (counts)"

  uv-vis:
    uv-vis-spectrum:
      label: UV-Vis Transmittance
      patterns:
        - _uv-vis
        - _uvvis
        - uv-vis
        - uvvis
      legacy_codes:
        - uv-vis
        - uvvis
        - uv_vis
      data_shape:
        kind: spectrum_2d
        columns:
          - wavelength_nm
          - absorbance
        units:
          - nm
          - au
      instruments:
        spectrometer-iop:
          header_lines: 1
      plot:
        layout: single
        columns:
          x: wavelength_nm
          y: absorbance
        axis:
          xlabel: "Wavelength (nm)"
          ylabel: "Absorbance (a.u.)"

  ec:
    ec-cv:
      label: Cyclic Voltammetry
      patterns:
        - _CV.
        - .cv
        - cv_
        - cv-
      legacy_codes: []
      data_shape:
        kind: trace_2d
        columns:
          - time_s
          - potential_v
          - current_a
      instruments:
        autolab-usth:
          header_lines: 0
      plot:
        layout: single
        columns:
          x: potential_v
          y: current_a
        axis:
          xlabel: "Potential (V)"
          ylabel: "Current (A)"

    ec-ca:
      label: Chronoamperometry
      patterns:
        - _CA.
        - .ca
        - ca_
        - ca-
      legacy_codes: []
      data_shape:
        kind: trace_2d
        columns:
          - time_s
          - potential_v
          - current_a
      instruments:
        autolab-usth:
          header_lines: 0
      plot:
        layout: single
        columns:
          x: time_s
          y: current_a
        axis:
          xlabel: "Time (s)"
          ylabel: "Current (A)"

    ec-eis:
      label: Electrochemical Impedance Spectroscopy
      patterns:
        - .mpt
        - _EIS.
        - .eis
        - _impedance
        - .z
      legacy_codes: []
      data_shape:
        kind: trace_2d
        columns:
          - time_s
          - potential_v
          - current_a
      instruments:
        autolab-usth:
          header_lines: 0
      plot:
        layout: dual_panel
        columns:
          x: z_real
          y: z_imag
        axis:
          xlabel: "Z' (Ω)"
          ylabel: "-Z'' (Ω)"
        figure: {}
        axes:
          grid: true
          grid_alpha: 0.3
        series:
          nyquist:
            label: "Nyquist"
          bode:
            label: "|Z|"
            color: "#2563eb"

  afm:
    afm-topography:
      label: AFM/SPM Surface Topography
      patterns:
        - .gwy
        - .spm
        - .ibw
        - .jpk
        - .stp
        - .top
      legacy_codes: []
      data_shape:
        kind: image_2d
        columns:
          - x_um
          - y_um
          - height_nm
      instruments: {}
      plot:
        layout: single
        columns:
          x: x_um
          y: y_um
        axis:
          xlabel: "X (µm)"
          ylabel: "Y (µm)"
        figure:
          figsize: [12, 5]
        cmap: viridis
