# config-studies.yaml — Canonical study definitions (v6)
#
# This is the single source of truth for all study configurations.
# Studies define detection patterns, instrument bindings, data shapes,
# and device-specific metadata requirements.
#
# Moved from config-devices.yaml in Phase 2 of the modular config split.

studies:
  iv:
    iv-bipolar-sweep:
      label: "Bipolar IV Sweep 0\u2192+V\u2192-V\u21920"
      patterns:
      - iv-sweep
      - _IV
      - iv-bipolar
      - sweep_
      legacy_codes:
      - iv
      - iv-sweep
      - iv_dc
      data_shape:
        kind: trace_2d
        columns:
        - time_s
        - voltage_v
        - current_a
      instruments:
        keithley-2400:
          header_lines: 23
          metadata:
            compliance:
              method: parse
              parser: compliance
              description: Compliance current (A)
            sweep_range:
              method: parse
              parser: sweep_range
              description: Sweep voltage range start/stop (V)
        keysight-b1500a:
          header_lines: 245
          metadata:
            set_voltage:
              method: parse
              parser: set_voltage
              description: Sweep max voltage from SetupTitle (V)
            compliance:
              method: parse
              parser: compliance
              description: Compliance current from Primary.Compliance (A)
            sweep_range:
              method: parse
              parser: sweep_range
              description: Sweep voltage range start/stop (V)
            repeat_count:
              method: parse
              parser: repeat_count
              description: Measurement repeat count
            compliance_analysis:
              method: analyze
              function: analyze_iv_compliance
              inputs:
              - voltage
              - current
              outputs:
              - in_compliance
              - compliance_current
              - compliance_voltage
              description: Compliance detection from IV data
    iv-breakdown:
      label: "Breakdown \u2014 ramped voltage to breakdown"
      patterns:
      - breakdown
      - _bd
      - _Vbd
      - bd_
      legacy_codes:
      - bd
      - breakdown
      data_shape:
        kind: trace_2d
        columns:
        - time_s
        - voltage_v
        - current_a
      instruments: {}
    iv-leakage:
      label: "Leakage \u2014 low-bias leakage current"
      patterns:
      - leakage
      - _leak
      - leak_
      legacy_codes:
      - leak
      - leakage
      data_shape:
        kind: trace_2d
        columns:
        - time_s
        - voltage_v
        - current_a
      instruments: {}

  pulse:
    pulse-stp-decay:
      label: "STP Decay \u2014 set pulse + current decay read"
      patterns:
      - stp
      - _STP
      - stp_decay
      - short-term
      legacy_codes:
      - stp
      - pulse-stp
      - short-term-plasticity
      data_shape:
        kind: waveform_2d
        columns:
        - time_s
        - voltage_v
        units:
        - s
        - V
      derived_metadata:
      - v_set_v
      - v_read_v
      - set_width_us
      - read_width_us
      - rise_us
      - fall_us
      - repeat_pattern
      device_overrides:
        volatile-memristor:
          add:
          - decay_tau_ms
          - r_read_ohm
      instruments:
        keysight-b1500a:
          header_lines: 147
          metadata:
            compliance:
              method: parse
              parser: compliance
              description: Compliance current from Primary.Compliance (A)
            repeat_count:
              method: parse
              parser: repeat_count
              description: Measurement repeat count
            waveform_params:
              method: analyze
              function: analyze_waveform_params
              inputs:
              - waveform_time
              - waveform_voltage
              outputs:
              - rise_us
              - fall_us
              - set_width_us
              - read_width_us
              description: Extracted pulse parameters from waveform definition

    pulse-ppf:
      label: "Paired-Pulse Facilitation \u2014 double set with \u0394t"
      patterns:
      - ppf
      - _PPF
      - paired-pulse
      legacy_codes:
      - ppf
      - pulse-ppf
      - paired-pulse
      data_shape:
        kind: waveform_2d
        columns:
        - time_s
        - voltage_v
        units:
        - s
        - V
      derived_metadata:
      - v_set_v
      - v_read_v
      - set_width_us
      - read_width_us
      - rise_us
      - fall_us
      - repeat_pattern
      instruments:
        keysight-b1500a:
          header_lines: 147

    pulse-endurance:
      label: Pulse Endurance Cycling
      patterns:
      - endurance
      - _endurance
      - endurance_
      legacy_codes:
      - endurance
      - pulse-endurance
      data_shape:
        kind: waveform_2d
        columns:
        - time_s
        - voltage_v
        units:
        - s
        - V
      derived_metadata:
      - v_set_v
      - v_read_v
      - set_width_us
      - read_width_us
      - rise_us
      - fall_us
      - repeat_pattern
      device_overrides:
        volatile-memristor:
          add:
          - r_decay_ohm
        non-volatile-memristor:
          add:
          - r_high_ohm
          - r_low_ohm
      instruments:
        keysight-b1500a:
          header_lines: 147

    pulse-retention:
      label: Pulse Retention Time
      patterns:
      - retention
      - _retention
      - retention_
      legacy_codes:
      - retention
      - pulse-retention
      data_shape:
        kind: waveform_2d
        columns:
        - time_s
        - voltage_v
        units:
        - s
        - V
      derived_metadata:
      - v_set_v
      - v_read_v
      - set_width_us
      - read_width_us
      - rise_us
      - fall_us
      - repeat_pattern
      device_overrides:
        non-volatile-memristor:
          add:
          - r_read_ohm
      instruments: {}

  raman:
    raman-spectrum:
      label: Raman Spectroscopy
      patterns:
      - _raman
      - _sers
      - raman-sers
      - _SERS
      legacy_codes:
      - raman
      - sers
      - raman-sers
      data_shape:
        kind: spectrum_2d
        columns:
        - wavelength_nm
        - intensity
        units:
        - nm
        - counts
      instruments:
        horiba-usth:
          header_lines: 45

  uv-vis:
    uv-vis-spectrum:
      label: UV-Vis Transmittance
      patterns:
      - _uv-vis
      - _uvvis
      - uv-vis
      - uvvis
      legacy_codes:
      - uv-vis
      - uvvis
      - uv_vis
      data_shape:
        kind: spectrum_2d
        columns:
        - wavelength_nm
        - absorbance
        units:
        - nm
        - au
      instruments:
        spectrometer-iop:
          header_lines: 1

  ec:
    ec-cv:
      label: Cyclic Voltammetry
      patterns:
      - _CV.
      - .cv
      - cv_
      - cv-
      legacy_codes: []
      data_shape:
        kind: trace_2d
        columns:
        - time_s
        - potential_v
        - current_a
      instruments:
        autolab-usth:
          header_lines: 0

    ec-ca:
      label: Chronoamperometry
      patterns:
      - _CA.
      - .ca
      - ca_
      - ca-
      legacy_codes: []
      data_shape:
        kind: trace_2d
        columns:
        - time_s
        - potential_v
        - current_a
      instruments:
        autolab-usth:
          header_lines: 0

    ec-eis:
      label: Electrochemical Impedance Spectroscopy
      patterns:
      - .mpt
      - _EIS.
      - .eis
      - _impedance
      - .z
      legacy_codes: []
      data_shape:
        kind: trace_2d
        columns:
        - time_s
        - potential_v
        - current_a
      instruments:
        autolab-usth:
          header_lines: 0

  afm:
    afm-topography:
      label: AFM/SPM Surface Topography
      patterns:
      - .gwy
      - .spm
      - .ibw
      - .jpk
      - .stp
      - .top
      legacy_codes: []
      data_shape:
        kind: image_2d
        columns:
        - x_um
        - y_um
        - height_nm
      instruments: {}
