techniques:
  pulse-stp:
    patterns: ["stp", "_stp", "pulse-stp", "stp-decay"]
    header_marker: "Time"
    devices:
      keithley-2400:
        delimiter: ","
        decimal: "."
        header_lines: 0
        encoding: "utf-8"
        columns:
          time: "Time (ms)"
          current: "Current (A)"
  pulse-ppf:
    patterns: ["ppf", "_ppf", "pulse-ppf", "ppf-index"]
    header_marker: "Pulse"
    devices:
      keithley-2400:
        delimiter: ","
        decimal: "."
        header_lines: 0
        encoding: "utf-8"
        columns:
          pulse: "Pulse"
          current: "Current (A)"
defaults:
  pulse-stp: keithley-2400
  pulse-ppf: keithley-2400
file_naming:
  patterns:
    - id: rNcN
      template: "{date_code}_{material}_{matrix}_{technique}_{suffix}"
      regex: '^(?P<date_code>\d{6})_(?P<material>[^_]+)_(?P<matrix>r\d+c\d+)_(?P<technique>[^_]+?)(?:_(?P<suffix>\d+))?\.\w+$'
      extract:
        matrix: "r(?P<row>\d+)c(?P<col>\d+)"
